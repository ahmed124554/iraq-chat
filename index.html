<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iraqiChat</title>
<style>
:root{--bg:#f4f5f8;--cd:#fff;--tx:#1c1e26;--mu:#6b7080;--ac:#5b5bd6;--bd:#dfe1ea;--me:#e8e8fb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161c;--cd:#1f2129;--tx:#eceef5;--mu:#9a9fb2;--bd:#32353f;--me:#2c2c52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161c;--cd:#1f2129;--tx:#eceef5;--mu:#9a9fb2;--bd:#32353f;--me:#2c2c52;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px Tahoma,Arial,sans-serif}
button,input,select{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer}.pr{background:var(--ac);color:#fff;border:0}
#login{max-width:380px;margin:6vh auto;padding:20px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column;gap:10px}
#login h2{margin:0;text-align:center}
#app{display:none;height:100%;flex-direction:column}
header{display:flex;gap:6px;align-items:center;padding:8px;background:var(--cd);border-bottom:1px solid var(--bd)}
header b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#bd{flex:1;display:flex;min-height:0;position:relative}
#side{width:220px;background:var(--cd);border-inline-start:1px solid var(--bd);overflow:auto;padding:8px}
#side h4{margin:10px 0 4px;color:var(--mu);font-size:12px}
.it{padding:6px 8px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.it:hover,.it.on{background:var(--me)}small{color:var(--mu)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#ms{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{padding:6px 10px;border-radius:10px;background:var(--cd);border:1px solid var(--bd);word-break:break-word;max-width:100%}
.m.me{background:var(--me)}.n{cursor:pointer}
.tg{font-size:10px;margin:0 4px;padding:1px 5px;border-radius:6px;background:var(--bd);color:var(--mu)}
.m img{display:block;max-width:240px;width:100%;border-radius:8px;margin-top:4px}.m audio{display:block;margin-top:4px;max-width:100%}
#bar{display:flex;gap:6px;padding:8px;background:var(--cd);border-top:1px solid var(--bd)}
#tx{flex:1;min-width:0}.rec{background:#d33!important;color:#fff}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.md{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.md h3{margin:0}.row{display:flex;gap:6px;align-items:center}.row input{flex:1;min-width:0}
@media(max-width:700px){#side{position:absolute;inset:0 auto 0 0;z-index:5;display:none;width:75%;box-shadow:2px 0 12px #0004}#side.open{display:block}}
</style></head><body>
<div id="login">
<h2>💬 iraqiChat</h2>
<input id="nm" placeholder="الاسم (عربي أو إنجليزي)" maxlength="20">
<input id="ag" type="number" min="1" max="99" placeholder="العمر (1-99)">
<select id="gd"><option>ذكر</option><option>أنثى</option><option>آخر</option></select>
<input id="pw" type="password" placeholder="كلمة السر (للعضوية فقط، 6 أحرف أو أكثر)">
<button class="pr" onclick="reg()">سجّل عضوية</button>
<button onclick="login()">الدخول بعضوية</button>
<button onclick="guest()">سجّل كزائر</button>
<small id="st">جاري الاتصال…</small>
</div>
<div id="app">
<header><button onclick="$('#side').classList.toggle('open')">☰</button><b id="ttl"></b>
<button id="hid" onclick="toggleHide()" title="تخفي">👁</button><button id="cfg" onclick="ownerPanel()">⚙</button><button onclick="out()">خروج</button></header>
<div id="bd"><div id="side"></div><div id="main"><div id="ms"></div>
<div id="bar"><button id="bi" onclick="$('#fi').click()">📷</button><button id="mic" onclick="mic()">🎤</button><button id="bf" onclick="fontModal()">🎨</button>
<input id="tx" placeholder="اكتب رسالتك…" onkeydown="if(event.key=='Enter')send()"><button class="pr" onclick="send()">إرسال</button>
<input id="fi" type="file" accept="image/*" hidden onchange="pickImg(this.files[0]);this.value=''"></div></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>{if(x!=null&&x!==false)e.append(x)});return e};
// الرتب: كل رتبة لها رقم، والصلاحيات تُحسب منه
const R=[['guest','زائر'],['bronze','برونزية'],['gold','ذهبية'],['diamond','ماسية'],['premium','بريميوم'],['superpremium','سوبر بريميوم'],['admin','أدمن'],['superadmin','سوبر أدمن'],['owner','المالك']];
const rk=u=>Math.max(0,R.findIndex(r=>r[0]==(u&&u.role)));
const rl=r=>(R.find(x=>x[0]==r)||R[0])[1];
const IMG=2,AUD=3,FNT=4,MOD=6,OWN=8;
const FONTS=['Tahoma','Arial','Georgia','Times New Roman','Courier New','Trebuchet MS','cursive'];
let S,me=null,found=false,view={t:'room'},D={users:[],rooms:[],msgs:[]},timer,rec;
const U=id=>D.users.find(u=>u.id==id);
const on=u=>u&&Date.now()-(u.seen||0)<300000;
const vis=u=>on(u)&&(!u.hidden||rk(me)>=rk(u));

// ===== إعدادات Firebase: الصق إعدادات مشروعك هنا =====
const CFG={apiKey:"AIzaSyBFbxLj8hC2uma5wQ5Mm0LwsieuYWIlUd0",authDomain:"iraqichat-18970.firebaseapp.com",projectId:"iraqichat-18970",appId:"1:552583222927:web:97c4f08abd99ebd4b742fa"};
let auth,fs,unsub=[],watchP=null,pubM=[],pmM=[],curRoom=null,unRoom=null;
const mix=()=>{D.msgs=[...pubM,...pmM];render()};
const lst=s=>s.docs.map(d=>({...d.data(),id:d.id}));
function initStore(){
  if(CFG.apiKey.startsWith('PASTE')){$('#st').textContent='⚠ لم تضع إعدادات Firebase بعد (CFG)';return}
  firebase.initializeApp(CFG);auth=firebase.auth();fs=firebase.firestore();
  S={mode:'fb',
    set:(n,id,o)=>{o=JSON.parse(JSON.stringify(o));return fs.doc(n=='msgs'?(o.to?'pms/'+id:'rooms/'+o.room+'/msgs/'+id):n+'/'+id).set(o)},
    upd:(n,id,o)=>fs.doc(n+'/'+id).update(JSON.parse(JSON.stringify(o))).catch(()=>{}),
    del:(n,id)=>fs.doc(n+'/'+id).delete(),
    room(id){if(id===curRoom)return;curRoom=id;if(unRoom)unRoom();pubM=[];if(!id){mix();return}
      unRoom=fs.collection('rooms/'+id+'/msgs').orderBy('t','desc').limit(100).onSnapshot(x=>{pubM=lst(x);mix()},()=>{})}};
  $('#st').textContent='متصل ✔';
  auth.onAuthStateChanged(async u=>{if(!u||me)return;await startWatch();if(U(u.uid))enter(u.uid)});
}
function startWatch(){
  if(watchP)return watchP;const uid=auth.currentUser.uid;let n=0,ok;watchP=new Promise(r=>ok=r);
  const w=(name,k)=>fs.collection(name).onSnapshot(x=>{D[name]=lst(x);if(!D[k]){D[k]=1;if(++n==2)ok()}render()},()=>{if(!D[k]){D[k]=1;if(++n==2)ok()}});
  unsub=[w('users','_u'),w('rooms','_r'),fs.collection('pms').where('p','array-contains',uid).onSnapshot(x=>{pmM=lst(x);mix()},()=>{})];
  return watchP}
function stop(){unsub.forEach(f=>f());unsub=[];if(unRoom)unRoom();unRoom=null;curRoom=null;watchP=null;pubM=[];pmM=[];D={users:[],rooms:[],msgs:[]}}

// ===== الدخول =====
function form(needPw){
  const name=$('#nm').value.trim(),age=+$('#ag').value,gender=$('#gd').value;
  if(!/^[\u0600-\u06FFa-zA-Z ]{2,20}$/.test(name))return alert('الاسم عربي أو إنجليزي فقط (2-20 حرف)');
  if(!(age>=1&&age<=99))return alert('العمر من 1 إلى 99');
  const f={name,age,gender};
  if(needPw){const pw=$('#pw').value;if(pw.length<6)return alert('كلمة السر 6 أحرف على الأقل');f.pw=pw}
  return f}
const same=(a,b)=>a.toLowerCase()==b.toLowerCase();
async function emailOf(n){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n.toLowerCase()));
  return [...new Uint8Array(b)].slice(0,16).map(x=>x.toString(16).padStart(2,'0')).join('')+'@iraqichat.app'}
async function reg(){const f=form(true);if(!f||!S)return;let id;
  try{id=(await auth.createUserWithEmailAndPassword(await emailOf(f.name),f.pw)).user.uid}
  catch(e){return alert(e.code=='auth/email-already-in-use'?'الاسم مسجل مسبقاً':'تعذر التسجيل: '+e.message)}
  let role='bronze';
  try{await fs.doc('config/owner').set({uid:id});role='owner'}catch(e){} // أول مسجّل يصبح المالك
  await S.set('users',id,{name:f.name,age:f.age,gender:f.gender,id,role,reg:true,seen:Date.now()});enter(id)}
async function login(){const f=form(true);if(!f||!S)return;
  try{await auth.signInWithEmailAndPassword(await emailOf(f.name),f.pw)}catch(e){return alert('الاسم أو كلمة السر غير صحيحة')}
  enter(auth.currentUser.uid)}
async function guest(){const f=form();if(!f||!S)return;
  try{await auth.signInAnonymously()}catch(e){return alert('تعذر الاتصال: '+e.message)}
  await startWatch();const id=auth.currentUser.uid;if(U(id))return enter(id);
  if(D.users.some(u=>(u.reg||on(u))&&same(u.name,f.name)))return alert('الاسم مستخدم');
  await S.set('users',id,{...f,id,role:'guest',seen:Date.now()});enter(id)}
const ROOMS=['الغرفة العامة','غرفة العراق','شباب','بنات','ترفيه','ثقافة وأدب'];
async function seedRooms(){if(!D.rooms.length)for(let i=0;i<ROOMS.length;i++)await S.set('rooms','r'+(i+1),{name:ROOMS[i],cap:50})}
async function enter(id){me={id};found=false;view={t:'room'};$('#login').style.display='none';$('#app').style.display='flex';
  await startWatch();clearInterval(timer);timer=setInterval(()=>me&&S.upd('users',me.id,{seen:Date.now()}),120000);
  const u=U(id);if(u&&u.role=='owner')seedRooms();render()}
function out(msg){clearInterval(timer);const m=me;me=null;$('#app').style.display='none';$('#login').style.display='flex';
  (async()=>{try{if(m){if(m.role=='guest')await fs.doc('users/'+m.id).delete();else await S.upd('users',m.id,{seen:0,room:null})}}catch(e){}
    stop();try{await auth.signOut()}catch(e){}})();
  if(msg)alert(msg)}

// ===== الغرف =====
function join(id){const r=D.rooms.find(x=>x.id==id);if(!r)return false;
  if(id==me.room){view={t:'room'};render();return true}
  const n=D.users.filter(u=>u.room==id&&on(u)&&u.id!=me.id).length;
  if(n>=(r.cap||50)&&rk(me)<OWN){alert('الغرفة ممتلئة');return false}
  view={t:'room'};S.upd('users',me.id,{room:id,seen:Date.now()});me.room=id;render();return true}

// ===== الإرسال =====
function send(extra){
  if(!me||!found)return;if(me.muted)return alert('أنت مكتوم');
  const o={from:me.id,name:me.name,role:me.role,t:Date.now(),text:'',...(extra||{})};
  if(rk(me)>=FNT){o.font=me.font||'';o.color=me.color||''}
  if(!extra){const t=$('#tx').value.trim();if(!t)return;o.text=t;$('#tx').value=''}
  if(view.t=='room'){if(!me.room)return;o.room=me.room;o.to=null}
  else{if(rk(me)<1)return;o.to=view.id;o.room=null;o.p=[me.id,view.id]}
  S.set('msgs','m'+Date.now()+Math.random().toString(36).slice(2,6),o)}
function pickImg(f){if(!f)return;const i=new Image();i.onload=()=>{const k=Math.min(1,480/i.width),c=h('canvas');c.width=i.width*k;c.height=i.height*k;
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);send({img:c.toDataURL('image/jpeg',.6)})};i.src=URL.createObjectURL(f)}
async function mic(){
  if(rec){rec.stop();return}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rec=new MediaRecorder(s,{audioBitsPerSecond:24000});
    rec.ondataavailable=e=>ch.push(e.data);
    rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());rec=null;$('#mic').classList.remove('rec');
      const fr=new FileReader();fr.onload=()=>send({aud:fr.result});fr.readAsDataURL(new Blob(ch,{type:ch[0]&&ch[0].type}))};
    rec.start();$('#mic').classList.add('rec');setTimeout(()=>rec&&rec.state=='recording'&&rec.stop(),15000)}
  catch(e){alert('تعذر الوصول للميكروفون')}}

// ===== النوافذ =====
function modal(title,...c){const o=h('div',{class:'ov',onclick:e=>{if(e.target==o)o.remove()}},
  h('div',{class:'md'},h('h3',{},title),...c,h('button',{onclick:()=>o.remove()},'إغلاق')));document.body.append(o);return o}
function fontModal(){
  const f=h('select',{},FONTS.map(x=>h('option',{value:x,...(me.font==x?{selected:1}:{})},x))),c=h('input',{type:'color',value:me.color||'#000000'});
  const o=modal('خط رسائلك',f,c,h('button',{class:'pr',onclick:()=>{S.upd('users',me.id,{font:f.value,color:c.value});o.remove()}},'حفظ'))}
function canAct(u){return u&&u.id!=me.id&&rk(me)>=MOD&&(rk(me)==OWN?u.role!='owner':rk(u)<rk(me))}
function userModal(id){const u=U(id);if(!u||u.id==me.id)return;
  const c=[h('div',{},u.name+' — '+rl(u.role)+' — '+u.age+' — '+u.gender)];
  if(rk(me)>=1&&rk(u)>=0)c.push(h('button',{onclick:()=>{view={t:'pm',id};o.remove();render()}},'✉ رسالة خاصة'));
  if(canAct(u)){
    c.push(h('button',{onclick:()=>{S.upd('users',id,{muted:!u.muted});o.remove()}},u.muted?'إلغاء الكتم':'كتم'));
    c.push(h('button',{onclick:()=>{S.upd('users',id,{kick:Date.now()+600000,room:null,seen:0});o.remove()}},'طرد (10 دقائق)'));
    c.push(h('button',{onclick:()=>{const n=prompt('الاسم الجديد',u.name);if(n&&/^[\u0600-\u06FFa-zA-Z ]{2,20}$/.test(n.trim()))S.upd('users',id,{name:n.trim()});o.remove()}},'تغيير الاسم'));
  }
  if(rk(me)==OWN&&u.role!='owner'){
    const s=h('select',{},R.slice(0,8).map(r=>h('option',{value:r[0],...(u.role==r[0]?{selected:1}:{})},r[1])));
    c.push(h('div',{class:'row'},s,h('button',{onclick:()=>{S.upd('users',id,{role:s.value});o.remove()}},'تعيين الرتبة')));
    c.push(h('button',{onclick:()=>{S.upd('users',id,{banned:!u.banned,room:null,seen:0});o.remove()}},u.banned?'فك الحظر':'حظر دائم'));
    c.push(h('button',{onclick:()=>{if(confirm('حذف العضو؟')){S.del('users',id);o.remove()}}},'حذف الحساب'));
  }
  const o=modal(u.name,...c)}
function toggleHide(){S.upd('users',me.id,{hidden:!me.hidden})}
function ownerPanel(){
  const o=modal('⚙ لوحة المالك');const box=o.querySelector('.md'),end=box.lastChild;
  const draw=()=>{[...box.querySelectorAll('.pn')].forEach(e=>e.remove());
    const p=h('div',{class:'pn',style:'display:flex;flex-direction:column;gap:8px'},h('b',{},'الغرف'));
    D.rooms.forEach(r=>{const n=h('input',{value:r.name}),c=h('input',{type:'number',min:1,max:500,value:r.cap||50,style:'max-width:70px'});
      p.append(h('div',{class:'row'},n,c,h('button',{onclick:()=>S.upd('rooms',r.id,{name:n.value.trim()||r.name,cap:+c.value||50})},'حفظ'),
        h('button',{onclick:()=>{if(confirm('حذف الغرفة؟'))S.del('rooms',r.id)}},'🗑')))});
    const nn=h('input',{placeholder:'اسم غرفة جديدة'});
    p.append(h('div',{class:'row'},nn,h('button',{class:'pr',onclick:()=>{if(nn.value.trim())S.set('rooms','r'+Date.now().toString(36),{name:nn.value.trim(),cap:50})}},'إضافة')));
    p.append(h('b',{},'الأعضاء (اضغط للتحكم)'));
    D.users.filter(u=>u.reg&&u.id!='owner').forEach(u=>p.append(h('div',{class:'it',onclick:()=>userModal(u.id)},u.name+(u.banned?' 🚫':'')+(u.muted?' 🔇':''),h('small',{},rl(u.role)))));
    box.insertBefore(p,end)};
  draw();o._t=setInterval(()=>{if(!o.isConnected)return clearInterval(o._t);if(!box.contains(document.activeElement)||document.activeElement.tagName!='INPUT')draw()},2500)}

// ===== العرض =====
function render(){
  if(!me)return;const m=U(me.id);
  if(!m){if(found)out('تم حذف حسابك');return}
  found=true;me=m;
  if(m.banned||m.kick>Date.now())return out('تم طردك من الموقع');
  if(!m.room&&D.rooms.length&&view.t=='room'){for(const r of D.rooms)if(join(r.id))return}
  S.room(m.room||null);
  const room=D.rooms.find(r=>r.id==m.room);
  const peer=view.t=='pm'?U(view.id):null;
  $('#ttl').textContent=view.t=='pm'?'خاص: '+(peer?peer.name:''):(room?room.name:'لا توجد غرف')+' — '+rl(m.role)+': '+m.name;
  $('#bi').style.display=rk(m)>=IMG?'':'none';$('#mic').style.display=rk(m)>=AUD?'':'none';
  $('#bf').style.display=rk(m)>=FNT?'':'none';$('#hid').style.display=rk(m)>=MOD?'':'none';$('#cfg').style.display=rk(m)==OWN?'':'none';
  $('#hid').style.opacity=m.hidden?1:.5;
  // القائمة الجانبية
  const sd=$('#side');sd.replaceChildren(h('h4',{},'الغرف'));
  D.rooms.forEach(r=>{const n=D.users.filter(u=>u.room==r.id&&on(u)&&!(u.hidden&&rk(m)<rk(u))).length;
    sd.append(h('div',{class:'it'+(r.id==m.room&&view.t=='room'?' on':''),onclick:()=>{join(r.id);sd.classList.remove('open')}},r.name,h('small',{},n+'/'+(r.cap||50))))});
  const ps=new Set(D.msgs.filter(x=>x.to&&(x.to==m.id||x.from==m.id)).map(x=>x.from==m.id?x.to:x.from));if(view.t=='pm')ps.add(view.id);
  if(ps.size){sd.append(h('h4',{},'الخاص'));ps.forEach(id=>{const u=U(id);sd.append(h('div',{class:'it'+(view.t=='pm'&&view.id==id?' on':''),onclick:()=>{view={t:'pm',id};sd.classList.remove('open');render()}},'✉ '+(u?u.name:'?')))})}
  sd.append(h('h4',{},'المتواجدون في الغرفة'));
  D.users.filter(u=>u.room==m.room&&vis(u)).sort((a,b)=>rk(b)-rk(a)).forEach(u=>
    sd.append(h('div',{class:'it',onclick:()=>userModal(u.id)},(u.hidden?'👁 ':'')+u.name,h('small',{},rl(u.role)))));
  // الرسائل
  const list=D.msgs.filter(x=>view.t=='room'?(x.room==m.room&&!x.to):(x.to&&((x.from==m.id&&x.to==view.id)||(x.from==view.id&&x.to==m.id)))).sort((a,b)=>a.t-b.t);
  const box=$('#ms'),near=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.replaceChildren(...list.map(x=>{const u=U(x.from)||{};const f=FONTS.includes(x.font)?x.font:'';const col=/^#[0-9a-f]{6}$/i.test(x.color||'')?x.color:'';
    return h('div',{class:'m'+(x.from==m.id?' me':'')},h('b',{class:'n',onclick:()=>userModal(x.from)},u.name||x.name),h('span',{class:'tg'},rl(u.role||x.role)),': ',
      h('span',{style:(f?'font-family:'+f+';':'')+(f&&col?'color:'+col:'')},x.text||''),
      x.img&&x.img.startsWith('data:image/')&&h('img',{src:x.img}),x.aud&&x.aud.startsWith('data:audio/')&&h('audio',{controls:1,src:x.aud}))}));
  if(near)box.scrollTop=box.scrollHeight}
initStore();
</script></body></html>
