<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iraq Chat | شات العراق</title>
<style>
:root{--bg:#f6f3ee;--sf:#fff;--tx:#1d1b18;--mu:#7a746a;--ac:#0f6b4a;--bd:#e2ddd3;--me:#e3f3ea;--dg:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--sf:#1e1e1b;--tx:#efece6;--mu:#9a948a;--ac:#3fbf8c;--bd:#33322d;--me:#1f3a2e;--dg:#f2b8b5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141412;--sf:#1e1e1b;--tx:#efece6;--mu:#9a948a;--ac:#3fbf8c;--bd:#33322d;--me:#1f3a2e;--dg:#f2b8b5;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:var(--dg);color:#fff}
input,select{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%}
.hide{display:none!important}
#login{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:22px;width:100%;max-width:380px}
.card h1{margin:0 0 4px;font-size:24px;color:var(--ac)}.card p{margin:0 0 14px;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:8px 4px;font-size:13px}
.f{margin-bottom:10px}.f label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
#err{color:var(--dg);min-height:20px;font-size:13px;margin:6px 0}
#app{height:100%;display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
header b{color:var(--ac);font-size:17px}header .sp{flex:1}
aside{background:var(--sf);border-inline-end:1px solid var(--bd);overflow-y:auto;padding:10px}
aside h3{margin:10px 0 6px;font-size:12px;color:var(--mu)}
.it{display:flex;justify-content:space-between;gap:6px;padding:7px 9px;border-radius:8px;cursor:pointer}
.it:hover,.it.on{background:var(--me)}.it small{color:var(--mu)}
main{display:flex;flex-direction:column;min-height:0}
#msgs{flex:1;overflow-y:auto;padding:12px 14px}
.m{padding:4px 0;line-height:1.7;word-break:break-word}.m .n{font-weight:700;cursor:pointer}.m img{max-width:220px;border-radius:8px;display:block;margin-top:4px}
.m audio{display:block;margin-top:4px;max-width:100%}.sys{color:var(--mu);font-size:13px;text-align:center}
#bar{display:flex;gap:6px;padding:10px;background:var(--sf);border-top:1px solid var(--bd);align-items:center}
#bar input[type=text]{flex:1}#bar select{width:auto}
#adm{border-top:1px solid var(--bd);margin-top:10px;padding-top:8px}#adm select,#adm button{margin-top:6px;width:100%}
#toast{position:fixed;bottom:80px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:60}.hasbg .m{background:color-mix(in srgb,var(--sf) 82%,transparent);border-radius:10px;padding:4px 10px;margin:3px 0;width:fit-content;max-width:95%}.hasbg .sys{background:color-mix(in srgb,var(--sf) 82%,transparent);border-radius:10px;padding:2px 10px}
#st{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}.sb{background:var(--sf);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:16px}.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.sb h3{margin:18px 0 6px;color:var(--ac)}.sb .it{cursor:default;align-items:center}.sb .it select,.sb .it button{width:auto;padding:4px 8px}
@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}aside{grid-column:1;max-height:34vh;border-inline-end:0;border-bottom:1px solid var(--bd)}header{grid-column:1}}
</style></head><body>
<div id="login"><div class="card">
<h1>Iraq Chat</h1><p>شات العراق</p>
<div class="tabs"><button data-t="reg">سجّل عضوية</button><button class="g" data-t="guest">سجّل كزائر</button><button class="g" data-t="login">الدخول بعضوية</button></div>
<div class="f"><label>الاسم (عربي أو إنجليزي)</label><input id="nm" maxlength="20" autocomplete="off"></div>
<div class="f" id="fa"><label>العمر (1-99)</label><input id="ag" type="number" min="1" max="99"></div>
<div class="f" id="fg"><label>الجنس</label><select id="gn"><option>ذكر</option><option>أنثى</option><option>آخر</option></select></div>
<div class="f" id="fp"><label>كلمة المرور</label><input id="pw" type="password" autocomplete="off"></div>
<div id="err"></div><button id="go" style="width:100%">دخول</button>

</div></div>
<div id="app" class="hide">
<header><b>Iraq Chat</b><span id="rn"></span><span class="sp"></span><span id="who"></span><label id="inv" class="hide"><input type="checkbox" id="ivc" style="width:auto"> تخفٍّ</label><select id="fs" class="hide" style="width:auto"></select><button class="g hide" id="gear" title="الإعدادات">⚙</button><button class="g" id="out">خروج</button></header>
<aside><h3>الغرف</h3><div id="rooms"></div><button id="addr" class="g hide" style="width:100%;margin-top:6px">+ غرفة</button><h3>المتصلون</h3><div id="users"></div>
<div id="adm" class="hide"><select id="tg"></select>
<button class="g" id="mu">كتم / فك الكتم</button><button class="g" id="kk">طرد</button><button class="g" id="rnm">تغيير الاسم</button>
<div id="own" class="hide"><select id="rl"></select><button id="sr">تعيين العضوية</button></div></div></aside>
<main><div id="msgs"></div>
<div id="bar"><button class="g hide" id="ib" title="صورة">🖼</button><button class="g hide" id="vb" title="رسالة صوتية">🎤</button><input type="file" id="fi" accept="image/*" class="hide"><input type="text" id="tx" maxlength="500" placeholder="اكتب رسالتك..." autocomplete="off"><button id="sd">إرسال</button></div></main>
</div><div id="st" class="hide"></div><div id="toast"></div>
<script>
const R=['bronze','gold','diamond','premium','superpremium','admin','superadmin','owner'];
const AR={bronze:'برونزية',gold:'ذهبية',diamond:'ماسية',premium:'بريميوم',superpremium:'سوبر بريميوم',admin:'أدمن',superadmin:'سوبر أدمن',owner:'مالك'};
const BD={bronze:'🥉',gold:'🥇',diamond:'💎',premium:'⭐',superpremium:'🌟',admin:'🛡',superadmin:'⚔',owner:'👑'};
const FONTS=[['','الخط الافتراضي'],['Tahoma,sans-serif','Tahoma'],['Georgia,serif','Georgia'],['"Courier New",monospace','Courier'],['"Noto Naskh Arabic",serif','نسخ'],['"Segoe Script",cursive','خط حر']];
const lv=r=>R.indexOf(r),$=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let db=null,usr=null,me=null,cur=null,lastRoom=null,tab='reg',kickSeen=0,rec=null,hb=null;
const D={members:[],rooms:[],presence:[],flags:[],msgs:[],settings:[]};
const L={d:{},subs:[]};
const DEF={siteName:'Iraq Chat',welcome:'',announce:'',maxRoom:50,allowGuests:true,allowReg:true,accent:'',badWords:'',bgRoom:'',bgPm:'',perms:{img:1,aud:2,font:3,hide:5,mod:5}};
let cfg={...DEF};
const ls={g:k=>{try{return localStorage.getItem(k)||''}catch(e){return''}},s:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const store={},subs={};let tok='',es=null,lastErr='';
const fire=c=>(subs[c]||[]).forEach(f=>f((store[c]||[]).slice()));
const S={
 listen(c,cb){(subs[c]=subs[c]||[]).push(cb);if(store[c])cb(store[c].slice());return()=>{}},
 async set(c,id,v){return !!(await api('doc',{c,id,v}))},
 async add(c,v){return this.set(c,Date.now().toString(36)+Math.random().toString(36).slice(2,6),v)},
 async del(c,id){return !!(await api('del',{c,id}))}
};
async function api(p,b){
 try{const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','X-Token':tok},body:JSON.stringify(b||{})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){lastErr=j.error||'حدث خطأ';if(r.status===401&&me){toast('انتهت الجلسة');out()}else if(p!=='me'&&!['login','register','guest'].includes(p))toast(lastErr);return null}
  return j}
 catch(e){lastErr='تعذّر الاتصال بالسيرفر';toast(lastErr);return null}
}
function connect(){
 return new Promise(res=>{
  if(es)es.close();es=new EventSource('/events?token='+encodeURIComponent(tok));
  es.addEventListener('init',e=>{const d=JSON.parse(e.data);for(const c in d){store[c]=d[c];fire(c)}res()});
  es.addEventListener('set',e=>{const{c,id,v}=JSON.parse(e.data),a=store[c]=store[c]||[],i=a.findIndex(x=>x.id===id),o={...v,id};i<0?a.push(o):a[i]=o;if(c==='msgs'&&a.length>500)a.splice(0,a.length-500);fire(c)});
  es.addEventListener('del',e=>{const{c,id}=JSON.parse(e.data);store[c]=(store[c]||[]).filter(x=>x.id!==id);fire(c)});
  es.addEventListener('kicked',()=>{toast('تم طردك من الدردشة');out()});
  setTimeout(res,4000)})
}
function toast(t){const e=$('#toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',2500)}
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('iraqchat:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const flag=n=>D.flags.find(f=>f.id===n)||{};
const disp=n=>flag(n).alias||n;
const fresh=p=>Date.now()-p.ts<60000;
const count=r=>D.presence.filter(p=>p.room===r&&fresh(p)).length;
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.className=b.dataset.t===t?'':'g');
 $('#fp').classList.toggle('hide',t==='guest');$('#fa').classList.toggle('hide',t==='login');$('#fg').classList.toggle('hide',t==='login');$('#err').textContent=''}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('#go').onclick=async()=>{try{await doGo()}catch(e){$('#err').textContent='خطأ: '+(e&&e.message||e)}};
async function doGo(){
 const name=$('#nm').value.trim(),age=+$('#ag').value,gender=$('#gn').value,pass=$('#pw').value,err=m=>$('#err').textContent=m;
 if(!/^[\u0600-\u06FFa-zA-Z0-9 ]{2,20}$/.test(name))return err('الاسم: حروف عربية أو إنجليزية (2-20 حرفًا)');
 if(tab!=='login'&&!(age>=1&&age<=99))return err('العمر يجب أن يكون بين 1 و 99');
 if(tab==='reg'&&pass.length<4)return err('كلمة المرور 4 أحرف على الأقل');
 $('#go').disabled=true;
 const r=await api(tab==='login'?'login':tab==='reg'?'register':'guest',{name,age,gender,pass});
 $('#go').disabled=false;
 if(!r)return err(lastErr);
 tok=r.token;ls.s('ic_tok',tok);me=r.me;await connect();kickSeen=Date.now();start();
}
async function start(){
 $('#login').classList.add('hide');$('#app').classList.remove('hide');
 if(me.role==='owner'&&!D.rooms.length)for(const n of['غرفة بغداد','غرفة البصرة','غرفة أربيل'])await S.add('rooms',{name:n});
 sync();joinRoom((D.rooms[0]||{}).id);
 hb=setInterval(beat,20000);
}
function sync(){
 const m=D.members.find(x=>x.id===me.name);if(m){me.role=m.role;me.font=m.font||''}
 const r=lv(me.role);
 $('#who').textContent=(BD[me.role]||'')+' '+disp(me.name)+' ('+AR[me.role]+')';
 $('#ib').classList.toggle('hide',r<cfg.perms.img);$('#vb').classList.toggle('hide',r<cfg.perms.aud);$('#gear').classList.toggle('hide',me.role!=='owner');
 $('#fs').classList.toggle('hide',r<cfg.perms.font);$('#inv').classList.toggle('hide',r<cfg.perms.hide);
 $('#adm').classList.toggle('hide',r<cfg.perms.mod);$('#own').classList.toggle('hide',r<7);$('#addr').classList.toggle('hide',r<7);
}
function beat(){if(!me)return;S.set('presence',me.name,{room:lastRoom||'',ts:Date.now(),invisible:!!$('#ivc').checked&&lv(me.role)>=cfg.perms.hide,role:me.role,gender:me.gender,age:me.age})}
function joinRoom(id){
 if(!id)return;
 const here=D.presence.find(p=>p.id===me.name&&p.room===id&&fresh(p));
 if(!here&&count(id)>=cfg.maxRoom&&me.role!=='owner')return toast('الغرفة ممتلئة ('+cfg.maxRoom+' عضوًا)');
 cur=id;lastRoom=id;beat();renderAll();
}
function openPM(n){if(n===me.name)return;cur='pm:'+[me.name,n].sort().join('|');renderAll()}
function renderAll(){if(!me)return;renderRooms();renderUsers();renderMsgs()}
function renderRooms(){
 const c=$('#rooms');c.textContent='';
 D.rooms.forEach(r=>{const i=el('div','it'+(cur===r.id?' on':''));i.append(el('span',null,r.name),el('small',null,count(r.id)+'/'+cfg.maxRoom));
  i.onclick=()=>joinRoom(r.id);
  if(me.role==='owner'){const eb=el('button','g','✎');eb.style.cssText='padding:0 6px';eb.onclick=e=>{e.stopPropagation();roomDlg(r)};i.append(eb)}
  c.append(i)});
 const cr=D.rooms.find(r=>r.id===cur);
 $('#rn').textContent=cur&&cur.startsWith('pm:')?'محادثة خاصة':(cr?'· '+cr.name:'');
}
function renderUsers(){
 const c=$('#users'),tg=$('#tg'),old=tg.value;c.textContent='';tg.textContent='';
 const adm=lv(me.role)>=cfg.perms.mod;
 D.presence.filter(p=>fresh(p)&&(!p.invisible||adm)).forEach(p=>{
  const i=el('div','it');i.append(el('span',null,(BD[p.role]||'')+' '+disp(p.id)+(p.invisible?' 👻':'')),el('small',null,p.gender));i.onclick=()=>openPM(p.id);c.append(i);
  if(p.id!==me.name&&p.role!=='owner'){const o=el('option',null,disp(p.id));o.value=p.id;tg.append(o)}});
 if(old)tg.value=old;
 const k=flag(me.name);
 
}
function renderMsgs(){
 const c=$('#msgs'),near=c.scrollHeight-c.scrollTop-c.clientHeight<80;c.textContent='';applyBg();
 if(!cur)return;
 if(!cur.startsWith('pm:'))[cfg.announce,cfg.welcome].forEach(t=>{if(t)c.append(el('div','sys',t))});
 D.msgs.filter(m=>m.room===cur).sort((a,b)=>a.ts-b.ts).forEach(m=>{
  const d=el('div','m');const n=el('span','n',(BD[m.r]||'')+' '+disp(m.from));n.onclick=()=>openPM(m.from);
  d.append(n,document.createTextNode(': '));
  if(m.kind==='img'){const i=el('img');i.src=m.data;d.append(i)}
  else if(m.kind==='aud'){const a=el('audio');a.controls=true;a.src=m.data;d.append(a)}
  else{const s=el('span',null,m.text);if(m.font)s.style.fontFamily=m.font;d.append(s)}
  c.append(d)});
 if(near||!c.dataset.i){c.scrollTop=c.scrollHeight;c.dataset.i=1}
}
async function send(p){
 if(!cur)return;
 if(flag(me.name).muted)return toast('أنت مكتوم من قبل الإدارة');
 const m={room:cur,from:me.name,r:me.role,ts:Date.now(),...p};
 if(lv(me.role)>=cfg.perms.font&&me.font)m.font=me.font;
 await S.add('msgs',m);
}
$('#sd').onclick=()=>{const t=$('#tx').value.trim();if(!t)return;$('#tx').value='';send({kind:'t',text:filt(t)})};
$('#tx').onkeydown=e=>{if(e.key==='Enter')$('#sd').click()};
$('#ib').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||lv(me.role)<cfg.perms.img)return;
 const im=new Image();im.onload=()=>{const s=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);send({kind:'img',data:cv.toDataURL('image/jpeg',.6)})};
 im.src=URL.createObjectURL(f)};
$('#vb').onclick=async()=>{
 if(lv(me.role)<cfg.perms.aud)return;
 if(rec){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[];rec=new MediaRecorder(st);
  rec.ondataavailable=e=>ch.push(e.data);
  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(tm);$('#vb').textContent='🎤';rec=null;
   const r=new FileReader();r.onload=()=>send({kind:'aud',data:r.result});r.readAsDataURL(new Blob(ch,{type:'audio/webm'}))};
  rec.start();$('#vb').textContent='⏹';var tm=setTimeout(()=>rec&&rec.stop(),8000)}
 catch(e){toast('لا يمكن الوصول إلى المايكروفون')}
};
FONTS.forEach(f=>{const o=el('option',null,f[1]);o.value=f[0];$('#fs').append(o)});
$('#fs').onchange=()=>{me.font=$('#fs').value;const m=D.members.find(x=>x.id===me.name);if(m)S.set('members',me.name,{...m,font:me.font,id:undefined})};
R.slice(0,7).forEach(r=>{const o=el('option',null,AR[r]);o.value=r;$('#rl').append(o)});
const tgt=()=>$('#tg').value;
$('#mu').onclick=()=>{const t=tgt();if(t)S.set('flags',t,{...flag(t),id:undefined,muted:!flag(t).muted})};
$('#kk').onclick=()=>{const t=tgt();if(t)S.set('flags',t,{...flag(t),id:undefined,kick:Date.now()})};
$('#rnm').onclick=async()=>{const t=tgt();if(!t)return;const n=await ask('الاسم الجديد للمستخدم (فارغ = الاسم الأصلي)',disp(t));if(n===null)return;S.set('flags',t,{...flag(t),id:undefined,alias:n.trim().slice(0,20)})};
$('#sr').onclick=()=>{const t=tgt(),m=D.members.find(x=>x.id===t);if(!t)return;if(!m)return toast('هذا المستخدم زائر وغير مسجّل، لا يمكن تعيين عضوية له');S.set('members',t,{...m,id:undefined,role:$('#rl').value})};
$('#addr').onclick=()=>roomDlg(null);
const inp=(v,t)=>{const i=document.createElement('input');i.type=t||'text';i.value=v==null?'':v;return i};
const rsel=(mx,v)=>{const s=document.createElement('select');R.slice(0,mx).forEach((r,i)=>{const o=el('option',null,AR[r]);o.value=i;s.append(o)});s.value=v;return s};
function filt(t){(cfg.badWords||'').split(/[,،]/).map(w=>w.trim()).filter(Boolean).forEach(w=>{t=t.split(w).join('***')});return t}
function applyCfg(){
 const s=D.settings.find(x=>x.id==='main')||{};
 cfg={...DEF,...s,perms:{...DEF.perms,...(s.perms||{})}};
 bgRoomV=(D.settings.find(x=>x.id==='bgRoom')||{}).v||'';bgPmV=(D.settings.find(x=>x.id==='bgPm')||{}).v||'';applyBg();
 document.title=cfg.siteName+' | شات العراق';
 document.querySelector('header b').textContent=cfg.siteName;
 document.querySelector('.card h1').textContent=cfg.siteName;
 if(cfg.accent)document.documentElement.style.setProperty('--ac',cfg.accent);else document.documentElement.style.removeProperty('--ac');
 document.querySelector('[data-t=guest]').classList.toggle('hide',!cfg.allowGuests);
 document.querySelector('[data-t=reg]').classList.toggle('hide',!cfg.allowReg);
 if((tab==='guest'&&!cfg.allowGuests)||(tab==='reg'&&!cfg.allowReg))setTab(cfg.allowReg?'reg':'login');
}
function openSettings(){
 if(!me||me.role!=='owner')return;
 const st=$('#st');st.textContent='';st.className='';st.onclick=e=>{if(e.target===st)st.className='hide'};
 const box=el('div','sb');st.append(box);
 const hd=el('div','sh');const xb=el('button','g','✕');xb.onclick=()=>st.className='hide';hd.append(el('b',null,'⚙ إعدادات الموقع'),xb);box.append(hd);
 const row=(l,i)=>{const d=el('div','f');d.append(el('label',null,l),i);box.append(d);return i};
 const chk=(l,v)=>{const d=el('label','f');const i=inp('','checkbox');i.checked=v;i.style.width='auto';d.append(i,document.createTextNode(' '+l));box.append(d);return i};
 box.append(el('h3',null,'عام'));

function dlg(build){return new Promise(res=>{const o=el('div');o.id='dlg';const b=el('div','sb');b.style.maxWidth='360px';o.append(b);document.body.append(o);const close=v=>{o.remove();res(v)};build(b,close);o.onclick=e=>{if(e.target===o)close(null)}})}
const btns=(...a)=>{const w=el('div');w.style.cssText='display:flex;gap:6px';a.forEach(x=>w.append(x));return w};
const ask=(t,v)=>dlg((b,close)=>{b.append(el('b',null,t));const i=inp(v);i.style.margin='10px 0';b.append(i);const ok=el('button',null,'حفظ'),no=el('button','g','إلغاء');ok.onclick=()=>close(i.value);no.onclick=()=>close(null);i.onkeydown=e=>{if(e.key==='Enter')ok.click()};b.append(btns(ok,no));setTimeout(()=>i.focus(),50)});
const sure=t=>dlg((b,close)=>{b.append(el('b',null,t));const ok=el('button','d','نعم'),no=el('button','g','إلغاء');ok.onclick=()=>close(true);no.onclick=()=>close(false);const w=btns(ok,no);w.style.marginTop='12px';b.append(w)});
function roomDlg(r){return dlg((b,close)=>{b.append(el('b',null,r?'تعديل الغرفة':'غرفة جديدة'));const i=inp(r?r.name:'');i.style.margin='10px 0';b.append(i);

 const x=el('button','g','إلغاء');x.onclick=()=>close();const a=[ok];
 if(r){const d=el('button','d','حذف');d.onclick=async()=>{close();if(await sure('حذف الغرفة '+r.name+'؟')){S.del('rooms',r.id);if(cur===r.id){cur=null;renderAll()}}};a.push(d)}
 a.push(x);b.append(btns(...a));i.onkeydown=e=>{if(e.key==='Enter')ok.click()};setTimeout(()=>i.focus(),50)})}
let bgRoomV='',bgPmV='';
const BGS=[['بدون',''],['رملي','#efe6d4'],['ليلي','#10202e'],['غروب','linear-gradient(135deg,#f6d365,#fda085)'],['بحر','linear-gradient(135deg,#a1c4fd,#c2e9fb)'],['نخيل','linear-gradient(135deg,#d4fc79,#96e6a1)']];
const bgCss=v=>!v?'':(v.startsWith('data:')?'url("'+v+'") center/cover no-repeat':v);
function applyBg(){const v=cur&&cur.startsWith('pm:')?bgPmV:bgRoomV,c=$('#msgs');c.style.background=bgCss(v);c.classList.toggle('hasbg',!!v)}
function bgPick(box,label,cur0){let v=cur0||'';const d=el('div','f');d.append(el('label',null,label));
 const pv=el('div');pv.style.cssText='height:54px;border:1px solid var(--bd);border-radius:8px;margin:4px 0';
 const show=()=>{pv.style.background=bgCss(v)};
 const s=document.createElement('select');BGS.forEach((x,i)=>{const o=el('option',null,x[0]);o.value=i;s.append(o)});s.onchange=()=>{v=BGS[s.value][1];show()};
 const c=inp('#efe6d4','color');c.style.cssText='width:60px;height:36px;padding:2px';c.oninput=()=>{v=c.value;show()};
 const f=inp('','file');f.accept='image/*';f.onchange=()=>{const x=f.files[0];if(!x)return;const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);v=cv.toDataURL('image/jpeg',.55);show()};im.src=URL.createObjectURL(x)};
 const w=btns(s,c,f);w.style.alignItems='center';d.append(pv,w);box.append(d);show();return{get:()=>v}}
